# examples/plugins/sandbox-stream-proxy/manifest.yaml demonstrates sandbox-process stream proxy registration.

schema_version: mc-gateway.plugin/v1
id: sandbox-stream-proxy
name: Sandbox Stream Proxy
version: 0.1.0
description: Sandbox-process example for stream.proxy/v1 through upstream.connect/v1 protocol-proxy mode.
artifact_type: binary
runtime:
  type: sandbox-process
  entry: bin/plugin
  protocol: mc-gateway-sandbox-process/v1
  os: linux
  arch: amd64
  abi_version: mc-gateway.sandbox-process.abi/v1
api_version: plugin-api/v1
sdk_module: github.com/tursom/mc-gateway/plugin/sandboxsdk
sdk_module_version: v0.1.0
go_version: go1.25.0
go_os: linux
go_arch: amd64
extension_points:
  - type: hook
    key: upstream.connect/v1
  - type: validator
    key: config.validate/v1
capabilities:
  extension_points:
    - upstream.connect/v1
    - config.validate/v1
  upstream_connect:
    mode: protocol-proxy
  minecraft:
    protocol_versions:
      tested: [767]
    forwarding:
      supported: ["none"]
      default: "none"
  scope:
    type: host
    values:
      - play.example
  rollout:
    mode: canary
  runtime:
    required_capabilities:
      - cpu.memory
      - process.restricted
runtime_limits:
  handler_timeout_ms: 1000
  initial_write_timeout_ms: 1000
  memory_bytes: 8388608
config_schema:
  type: object
  additionalProperties: false
