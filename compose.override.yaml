# compose.override.yaml 把本地 Compose 覆盖项与偏生产形态的基础服务定义分开维护。

services:
  mc-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        NODE_IMAGE: ${NODE_IMAGE:-node:24.11.1-alpine}
        GO_IMAGE: ${GO_IMAGE:-golang:1.25.0-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
